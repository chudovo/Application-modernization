name: case-04 .NET MAUI to React Native

on:
  push:
    paths:
      - "cases/04-maui-to-react-native/**"
      - "cases/02-wcf-to-web-api/after/**"
      - ".github/workflows/case-04-maui-to-react-native.yml"
  pull_request:
    paths: ["cases/04-maui-to-react-native/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: cases/04-maui-to-react-native/after

jobs:
  scenarios:
    name: Scenarios against the React Native screens and the real service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  app-android:
    name: React Native app builds for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: cases/04-maui-to-react-native/after/android
      - name: The legacy settings module is in the app
        run: unzip -p android/app/build/outputs/apk/debug/app-debug.apk 'classes*.dex' | grep -a -q LegacySettingsModule

  app-ios:
    name: React Native app builds for the iOS simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx expo prebuild --platform ios
        env:
          CI: 1
      - run: |
          xcodebuild -workspace ios/ParcelTracker.xcworkspace -scheme ParcelTracker -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
