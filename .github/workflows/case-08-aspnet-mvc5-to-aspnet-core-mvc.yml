name: case-08 ASP.NET MVC 5 to ASP.NET Core MVC

on:
  push:
    paths: ["cases/08-aspnet-mvc5-to-aspnet-core-mvc/**", ".github/workflows/case-08-aspnet-mvc5-to-aspnet-core-mvc.yml"]
  pull_request:
    paths: ["cases/08-aspnet-mvc5-to-aspnet-core-mvc/**"]
  workflow_dispatch:

jobs:
  contract-before:
    name: Contract against ASP.NET MVC 5 on IIS Express
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: cases/08-aspnet-mvc5-to-aspnet-core-mvc
    env:
      SEMINARS_URL: http://localhost:5080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build before/src/Seminars.Web --nologo
      # One step: a process started in a step does not outlive it.
      - name: Run the application under IIS Express and the contract against it
        run: |
          $site = (Resolve-Path before/src/Seminars.Web).Path
          $iis = Start-Process "C:\Program Files\IIS Express\iisexpress.exe" -ArgumentList "/path:$site", "/port:5080", "/clr:v4.0" -RedirectStandardOutput iis.log -RedirectStandardError iis.err -PassThru
          foreach ($i in 1..60) {
            try { $r = Invoke-WebRequest "$env:SEMINARS_URL/" -UseBasicParsing -TimeoutSec 30; if ($r.StatusCode -eq 200) { break } } catch { Start-Sleep -Seconds 2 }
          }
          dotnet test contract --nologo
          $result = $LASTEXITCODE
          Stop-Process -Id $iis.Id -Force
          exit $result

  contract-after:
    name: Contract against ASP.NET Core MVC on Kestrel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cases/08-aspnet-mvc5-to-aspnet-core-mvc
    env:
      SEMINARS_URL: http://localhost:5080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build after/src/Seminars.Web --nologo
      - name: Run the application and the contract against it
        run: |
          dotnet run --project after/src/Seminars.Web --no-build --no-launch-profile --urls "$SEMINARS_URL" > app.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null "$SEMINARS_URL/" && break; sleep 1; done
          dotnet test contract --nologo
